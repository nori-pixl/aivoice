<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ボイスサイト</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h1 { color: #333; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI読み上げ</h1>
    <textarea id="text-to-read" placeholder="ここに読み上げたい文字を入力してください... / Enter text here..."></textarea>
    
    <select id="voice-select">
        <option value="">読み込み中...</option>
    </select>
    
    <button onclick="speak()">音声を再生</button>
</div>

<script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text-to-read');
    const voiceSelect = document.getElementById('voice-select');
    let voices = [];

    // 音声リストを取得する関数
    function populateVoiceList() {
        voices = synth.getVoices();
        
        // 日本語（ja）と英語（en）の音声を取得
        const filteredVoices = voices.filter(voice => voice.lang.includes('ja') || voice.lang.includes('en'));
        
        // 言語コードでソート（日本語を上、英語を下にするなど並び替え用）
        filteredVoices.sort((a, b) => a.lang.localeCompare(b.lang));

        voiceSelect.innerHTML = '';
        
        if (filteredVoices.length === 0) {
            const option = document.createElement('option');
            option.textContent = '利用可能な音声がありません';
            voiceSelect.appendChild(option);
            return;
        }

        filteredVoices.forEach((voice) => {
            const option = document.createElement('option');
            option.textContent = `${voice.name} (${voice.lang})`;
            option.setAttribute('data-lang', voice.lang);
            option.setAttribute('data-name', voice.name);
            voiceSelect.appendChild(option);
        });

        // 初期テキストの設定（選択された最初の音声が英語なら英語、日本語なら日本語にする）
        if (textInput.value === '') {
            const firstVoice = voiceSelect.selectedOptions[0]?.getAttribute('data-lang') || '';
            textInput.value = firstVoice.includes('en') 
                ? 'Hello, I am an AI voice.' 
                : 'こんにちは、私はAIボイスです。';
        }
    }

    // ブラウザの音声設定が読み込まれたら実行
    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }

    // 読み上げ関数
    function speak() {
        if (synth.speaking) {
            console.error('すでに話しています');
            return;
        }
        if (textInput.value !== '') {
            const utterThis = new SpeechSynthesisUtterance(textInput.value);
            
            if (voiceSelect.selectedOptions.length > 0) {
                const selectedVoiceName = voiceSelect.selectedOptions[0].getAttribute('data-name');
                const selectedVoice = voices.find(voice => voice.name === selectedVoiceName);
                if (selectedVoice) {
                    utterThis.voice = selectedVoice;
                }
            }
            
            // 速度やピッチの設定（オプション）
            utterThis.pitch = 1;
            utterThis.rate = 1;
            
            synth.speak(utterThis);
        }
    }
</script>

</body>
</html>
